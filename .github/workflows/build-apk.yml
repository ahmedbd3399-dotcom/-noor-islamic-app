name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تجهيز Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: البحث عن ملف ZIP وفك الضغط
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "📦 ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          INDEX=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "❌ لم يتم العثور على index.html داخل ZIP"
            exit 1
          fi

          WEB_SOURCE=$(dirname "$INDEX")

          echo "WEB_SOURCE=$WEB_SOURCE" >> "$GITHUB_ENV"

          echo "✅ ملفات التطبيق موجودة في:"
          echo "$WEB_SOURCE"

      - name: إنشاء مشروع Capacitor
        run: |
          mkdir -p web
          cp -R "$WEB_SOURCE"/. web/

          cd web

          cat > package.json <<'EOF'
          {
            "name": "noor-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "latest",
              "@capacitor/android": "latest"
            },
            "devDependencies": {
              "@capacitor/cli": "latest"
            }
          }
          EOF

          cat > capacitor.config.js <<'EOF'
          const config = {
            appId: "com.ahmedbadr.noor",
            appName: "نُور",
            webDir: "."
          };

          module.exports = config;
          EOF

      - name: تثبيت Capacitor
        working-directory: web
        run: npm install

      - name: إضافة Android
        working-directory: web
        run: npx cap add android

      - name: مزامنة التطبيق
        working-directory: web
        run: npx cap sync android

      - name: بناء APK
        working-directory: web/android
        run: ./gradlew assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
