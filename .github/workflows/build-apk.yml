name: Build Noor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java and Node
        run: |
          java -version
          javac -version
          node -v
          npm -v

      - name: Find Latest ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -printf '%T@ %p\n' |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted web
          mkdir -p extracted
          mkdir -p web/www

          unzip -q "$ZIP_FILE" -d extracted

          INDEX=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found inside ZIP."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$INDEX")

          echo "Website directory: $SOURCE_DIR"

          cp -R "$SOURCE_DIR"/. web/www/
          rm -rf web/www/.github web/www/native-android

          if [ ! -d extracted/native-android ]; then
            echo "ERROR: native-android folder missing from ZIP."
            exit 1
          fi

      - name: Create package.json
        working-directory: web
        run: |
          cat > package.json <<'EOF'
          {
            "name": "noor-islamic-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        working-directory: web
        run: npm install

      - name: Create Capacitor Config
        working-directory: web
        run: |
          cat > capacitor.config.js <<'EOF'
          const config = {
            appId: "com.ahmedbadr.noor",
            appName: "نُور",
            webDir: "www"
          };

          module.exports = config;
          EOF

      - name: Add Android
        working-directory: web
        run: npx cap add android

      - name: Install Noor Native Adhan
        working-directory: web
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/ahmedbadr/noor
          cp ../extracted/native-android/*.java android/app/src/main/java/com/ahmedbadr/noor/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms='''\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'''
          if 'SCHEDULE_EXACT_ALARM' not in s: s=s.replace('<application', perms+'    <application',1)
          if 'ACCESS_FINE_LOCATION' not in s:
              s=s.replace('<application', '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<application', 1)
          services='''\n        <receiver android:name=".AdhanReceiver" android:exported="false" />\n        <receiver android:name=".BootReceiver" android:enabled="true" android:exported="false">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.TIME_SET" />\n                <action android:name="android.intent.action.TIMEZONE_CHANGED" />\n            </intent-filter>\n        </receiver>\n        <service android:name=".AdhanService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n'''
          if '.AdhanService' not in s: s=s.replace('</application>', services+'    </application>')
          icon_src=Path('../extracted/native-android/noor_icon.png')
          if icon_src.exists():
              import shutil
              res=Path('android/app/src/main/res/drawable')
              res.mkdir(parents=True,exist_ok=True)
              shutil.copy2(icon_src,res/'noor_icon.png')
              s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/noor_icon"')
              s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/noor_icon"')
          p.write_text(s)
          PY

      - name: Verify Manifest Permissions
        working-directory: web
        shell: bash
        run: |
          echo "== Permissions declared in final AndroidManifest.xml =="
          grep -o '<uses-permission[^/]*/>' android/app/src/main/AndroidManifest.xml || echo "NO PERMISSIONS FOUND - THIS IS A BUG"
          echo "== Receivers / Services declared =="
          grep -o '<receiver[^>]*>' android/app/src/main/AndroidManifest.xml || true
          grep -o '<service[^>]*>' android/app/src/main/AndroidManifest.xml || true
          echo "== Confirming MainActivity.java has AndroidNoor bridge =="
          grep -c "AndroidNoor" android/app/src/main/java/com/ahmedbadr/noor/MainActivity.java || echo "MISSING - THIS IS A BUG"

      - name: Sync Android
        working-directory: web
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Islamic-App-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
