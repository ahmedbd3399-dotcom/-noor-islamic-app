name: Build Noor APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check_zip.outputs.should_build }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check ZIP
        id: check_zip
        shell: bash
        run: |
          set -e

          ZIP_COUNT=$(find . -maxdepth 2 -type f -iname "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "No ZIP exists. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "ZIP found."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    needs: check
    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find Latest ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP found."
            exit 1
          fi

          echo "Using:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted web
          mkdir -p extracted web

          unzip -q "$ZIP_FILE" -d extracted

          INDEX=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found inside ZIP."
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX")

          echo "Web directory:"
          echo "$WEB_DIR"

          cp -R "$WEB_DIR"/. web/

      - name: Prepare Capacitor
        working-directory: web
        shell: bash
        run: |

          cat > package.json <<'EOF'
          {
            "name": "noor-islamic-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

          cat > capacitor.config.js <<'EOF'
          const config = {
            appId: "com.ahmedbadr.noor",
            appName: "نُور",
            webDir: "."
          };

          module.exports = config;
          EOF

      - name: Install Dependencies
        working-directory: web
        run: npm install

      - name: Add Android
        working-directory: web
        run: npx cap add android

      - name: Sync Android
        working-directory: web
        run: npx cap sync android

      - name: Build APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
