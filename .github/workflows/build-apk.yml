name: Build Noor APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  check:
    runs-on: ubuntu-latest

    outputs:
      should_build: ${{ steps.check_zip.outputs.should_build }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        id: check_zip
        shell: bash
        run: |
          ZIP_COUNT=$(find . -maxdepth 2 -type f -iname "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -gt 0 ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "ZIP found."
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No ZIP found. Build skipped."
          fi


  build-apk:

    needs: check

    if: needs.check.outputs.should_build == 'true'

    runs-on: ubuntu-latest

    steps:

      # تحميل الريبو
      - name: Checkout Project
        uses: actions/checkout@v4


      # Node 22
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      # التأكد من Java
      - name: Check Java
        run: |
          java -version
          javac -version


      # البحث عن أحدث ZIP
      - name: Find Latest ZIP
        shell: bash
        run: |

          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            -printf '%T@ %p\n' |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Using ZIP:"
          echo "$ZIP_FILE"


      # فك ZIP تلقائيًا
      - name: Extract ZIP
        shell: bash
        run: |

          set -e

          rm -rf extracted
          rm -rf web

          mkdir -p extracted
          mkdir -p web/www

          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for index.html..."

          INDEX_FILE=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX_FILE" ]; then
            echo "ERROR: index.html was not found inside ZIP."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$INDEX_FILE")

          echo "Website directory:"
          echo "$SOURCE_DIR"

          cp -R "$SOURCE_DIR"/. web/www/

          echo "Website copied successfully."


      # إنشاء package.json
      - name: Create package.json
        working-directory: web
        shell: bash
        run: |

          cat > package.json <<'EOF'
          {
            "name": "noor-islamic-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF


      # إعداد Capacitor
      - name: Create Capacitor Config
        working-directory: web
        shell: bash
        run: |

          cat > capacitor.config.js <<'EOF'
          const config = {
            appId: "com.ahmedbadr.noor",
            appName: "نُور",
            webDir: "www"
          };

          module.exports = config;
          EOF


      # تثبيت Capacitor
      - name: Install Dependencies
        working-directory: web
        run: npm install


      # إنشاء Android
      - name: Add Android
        working-directory: web
        run: npx cap add android


      # مزامنة Android
      - name: Sync Android
        working-directory: web
        run: npx cap sync android


      # بناء APK
      - name: Build Debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon


      # رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Islamic-App-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
