name: Build Noor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java and Node
        run: |
          java -version
          javac -version
          node -v
          npm -v

      - name: Find Latest ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -printf '%T@ %p\n' |
            sort -nr |
            head -n 1 |
            cut -d' ' -f2-)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted web
          mkdir -p extracted
          mkdir -p web/www

          unzip -q "$ZIP_FILE" -d extracted

          INDEX=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found inside ZIP."
            exit 1
          fi

          SOURCE_DIR=$(dirname "$INDEX")

          echo "Website directory: $SOURCE_DIR"

          cp -R "$SOURCE_DIR"/. web/www/

      - name: Create package.json
        working-directory: web
        run: |
          cat > package.json <<'EOF'
          {
            "name": "noor-islamic-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^8.0.0",
              "@capacitor/android": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

      - name: Install Dependencies
        working-directory: web
        run: npm install

      - name: Create Capacitor Config
        working-directory: web
        run: |
          cat > capacitor.config.js <<'EOF'
          const config = {
            appId: "com.ahmedbadr.noor",
            appName: "نُور",
            webDir: "www"
          };

          module.exports = config;
          EOF

      - name: Add Android
        working-directory: web
        run: npx cap add android

      - name: Sync Android
        working-directory: web
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Islamic-App-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
